name: Build

# Builds every plugin in the solution on each push to main and on pull requests,
# so you find out right away if something no longer compiles.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build ffxiv-plugins.slnx --configuration Release

      - name: Upload plugin zips
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ./*/bin/Release/*/latest.zip
          if-no-files-found: error
          retention-days: 7
