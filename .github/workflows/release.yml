name: Release

# Push a tag like v1.0.1 to publish a release. This builds every plugin,
# attaches <Plugin>.zip files and repo.json to a GitHub Release, and players'
# Dalamud picks up the update from the "latest" release's repo.json.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build ffxiv-plugins.slnx --configuration Release

      - name: Package plugins and repo.json
        run: ./.github/scripts/make-release.ps1 -Repo "${{ github.repository }}" -Tag "${{ github.ref_name }}" -OutDir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --title "${{ github.ref_name }}" --generate-notes
